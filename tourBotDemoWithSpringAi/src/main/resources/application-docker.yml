server:
  port: 8090

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o
history:
  url: ${HISTORY_SERVICE_URL}

logging:
  level:
    org.springframework.boot.autoconfigure.jdbc: DEBUG

whether:
  api-key: ${OPENWHETHER_API_KEY}

ai:
  prompt:
    orchestrator: |
      You are an AI orchestrator.

      Your role:
      - Decide whether to answer directly or use tools
      
      Rules:
      - If the question requires real-time or up-to-date information, you MUST use a tool.
      - Weather, news, stock, exchange rate MUST use search tool.
      - DO NOT answer from your own knowledge if freshness is important.

      Use the search tool when:
      - The question requires up-to-date information
      - The question is about external knowledge, news, or trends

      Do NOT use the tool when:
      - The question is simple or common knowledge

      Always choose the best approach.

    recommend-agent: |
      You are a search assistant.

      Your job:
      - Find relevant and up-to-date information
      - Provide concise and factual summaries
      - Avoid hallucinations