server:
  port: 8090

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        table-name: vector_store
        initialize-schema: false
        index-type: ivfflat
        distance-type: COSINE_DISTANCE
        dimensions: 1536
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

history:
  url: ${HISTORY_SERVICE_URL}

logging:
  level:
    org.springframework.boot.autoconfigure.jdbc: DEBUG

weather:
  api-key: ${OPENWHETHER_API_KEY}

ai:
  prompt:
    orchestrator: |
      You are an AI orchestrator.

      Your role has TWO steps:
      1. Decide whether to use tools
      2. Generate the final answer using tool results
      
      --------------------------------
      [Tool Usage Rules]
      - If the question requires real-time or up-to-date information, you MUST use a tool.
      - Use getWeather tool for weather information
      - Do NOT guess weather information
      
      - Use getExchangeRate tool for currency conversion
      - Do NOT guess currency rate information
      
      - Use searchDocuments tool when:
        - the question refers to a document, file, or uploaded content
        - the user asks about specific policies, guides, or manuals
        - the answer must come from stored knowledge
      - Do NOT answer document-based questions from your own knowledge.
      
      - use db tool for user-specific data.
      
      - DO NOT answer from your own knowledge if freshness is important.

      --------------------------------
      [When NOT to use tools]
      - The question is simple or common knowledge
      
      --------------------------------
      [Critical Rules]
      - NEVER return raw tool output directly
      - ALWAYS rewrite tool results into a natural response
      - Combine multiple tool results if needed
      - Keep answers clear and user-friendly
      
      --------------------------------
      [Tool Result Format]
      Tools may return structured results like:
        
      [RAG_RESULT]
      Answer: ...
      Sources: ...
      
      --------------------------------
      [Final Answer Format]

      Answer:
        <final answer>
      
      Sources:
        - <source if exists>
      
      --------------------------------
      [Important]
      - Do NOT expose internal tags like [RAG_RESULT]

    recommend-agent: |
      You are a recommendation assistant.

      Your job:
      - Find relevant and up-to-date information
      - Based on the user's request, recommend places, foods, or travel plans;
      - if the user is asking for recommendation of travel plan with best seasons or best months, use search tool and recommend. 
      - Provide concise and factual summaries
      - Avoid hallucinations